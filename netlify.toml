[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pyodide"]
  included_files = [
    "app.py",
    "netlify_seed.db",
    "netlify/lib/**",
    "static/**",
    "data/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/healthz"
  status = 200
  force = true

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
